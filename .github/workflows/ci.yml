name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install ruff==$(grep '^ruff==' requirements-dev.txt | cut -d= -f3)
      - run: ruff check .
      - run: ruff format --check .

  test-train:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install
        run: pip install -r requirements-dev.txt
      - name: Train (MLflow tracking + export models/)
        run: PYTHONPATH=src python -m credit_scoring.train
      - name: Tests + coverage
        run: >
          pytest --cov --cov-report=term --cov-report=json:reports/coverage.json
          --junitxml=reports/junit.xml
      - name: Drift report (Evidently)
        run: PYTHONPATH=src python -m credit_scoring.drift
      - name: Load test
        run: |
          python scripts/load_test.py --requests 2000 --concurrency 20
          python scripts/load_test.py --requests 2000 --concurrency 1 --output reports/load_test_sequential.json
      - name: Collect metrics
        run: python scripts/collect_metrics.py
      - uses: actions/upload-artifact@v4
        with:
          name: model
          path: models/
      - uses: actions/upload-artifact@v4
        with:
          name: reports
          path: reports/

  docker:
    runs-on: ubuntu-latest
    needs: test-train
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: model
          path: models/
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: credit-scoring-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        run: |
          docker run -d --name api -p 8000:8000 credit-scoring-api:ci
          for i in $(seq 1 30); do curl -fs localhost:8000/health && break; sleep 1; done
          curl -fs localhost:8000/health | grep '"model_loaded":true'
          curl -fs -X POST localhost:8000/predict -H 'Content-Type: application/json' \
            -d '{"checking_status":"<0","duration":24,"credit_history":"existing paid","purpose":"radio/tv","credit_amount":3500,"savings_status":"<100","employment":"1<=X<4","installment_commitment":3,"personal_status":"male single","other_parties":"none","residence_since":2,"property_magnitude":"car","age":35,"other_payment_plans":"none","housing":"own","existing_credits":1,"job":"skilled","num_dependents":1,"own_telephone":"none","foreign_worker":"yes"}'
          docker exec api id -u | grep -v '^0$'
          docker rm -f api
